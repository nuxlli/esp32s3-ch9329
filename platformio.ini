; ESP32-S3 firmware that emulates a WCH CH9329 UART-to-USB-HID bridge,
; so it can be driven by kvm-serial (https://github.com/sjmf/kvm-serial).
;
;   "COM" port (UART0, GPIO43/44 via onboard USB-UART bridge) -> controlling computer
;   "USB" port (native USB OTG, GPIO19/20)                    -> target computer

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem5B7A0178501
monitor_port = /dev/cu.usbmodem5B7A0178501
monitor_speed = 115200
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0          ; native USB in OTG (TinyUSB) mode
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial = UART0 = "COM" port
    -DCORE_DEBUG_LEVEL=0          ; no log output mixed into the protocol stream

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<ch9329_parser.cpp>
